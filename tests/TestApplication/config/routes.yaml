sylius_admin:
    resource: "@SyliusAdminBundle/config/routing.yaml"
    prefix: /admin

sylius_shop:
    resource: "@SyliusShopBundle/config/routing.yaml"
    prefix: /{_locale}
    requirements:
        _locale: ^[A-Za-z]{2,4}(_([A-Za-z]{4}|[0-9]{3}))?(_([A-Za-z]{2}|[0-9]{3}))?$

sylius_api:
    resource: "@SyliusApiBundle/config/routing.yaml"
    prefix: /api
