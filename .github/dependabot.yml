version: 2
updates:
  - package-ecosystem: "composer"
    # A release must be a week old before it is proposed (security updates ignore the cooldown).
    cooldown:
        default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # A release must be a week old before it is proposed (security updates ignore the cooldown).
    cooldown:
        default-days: 7
    open-pull-requests-limit: 10
